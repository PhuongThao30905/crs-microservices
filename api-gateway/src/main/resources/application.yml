spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # =========================
            # AUTH SERVICE
            # /api/auth/login
            # -> /auth/login
            # =========================
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/auth/(?<segment>.*), /auth/$\{segment}

            # =========================
            # COURSE SERVICE - LIST
            # /api/courses
            # -> /courses
            # =========================
            - id: course-service-list
              uri: http://localhost:8082
              predicates:
                - Path=/api/courses
              filters:
                - RewritePath=/api/courses, /courses

            # =========================
            # COURSE SERVICE - DETAIL
            # /api/courses/1
            # -> /courses/1
            # =========================
            - id: course-service-detail
              uri: http://localhost:8082
              predicates:
                - Path=/api/courses/**
              filters:
                - RewritePath=/api/courses/(?<segment>.*), /courses/$\{segment}

            # =========================
            # REGISTRATION SERVICE - LIST
            # /api/registrations
            # -> /registrations
            # =========================
            - id: registration-service-list
              uri: http://localhost:8083
              predicates:
                - Path=/api/registrations
              filters:
                - RewritePath=/api/registrations, /registrations

            # =========================
            # REGISTRATION SERVICE - DETAIL
            # /api/registrations/1
            # -> /registrations/1
            # =========================
            - id: registration-service-detail
              uri: http://localhost:8083
              predicates:
                - Path=/api/registrations/**
              filters:
                - RewritePath=/api/registrations/(?<segment>.*), /registrations/$\{segment}

            # =========================
            # PUBLIC COURSE API
            # Dành cho đối tác ngoài
            # /api/public/courses
            # -> /courses
            # =========================
            - id: course-service-partner
              uri: http://localhost:8082
              predicates:
                - Path=/api/public/courses
              filters:
                - RewritePath=/api/public/courses, /courses

          # =========================
          # CORS
          # Chuẩn bị cho Frontend
          # =========================
          globalcors:
            add-to-simple-url-handler-mapping: true

            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"

                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS

                allowedHeaders:
                  - "*"


# =========================
# GATEWAY PORT
# =========================
server:
  port: 8080


# =========================
# JWT SECRET
# Phải giống auth-service,
# course-service,
# registration-service
# =========================
jwt:
  secret: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te


# =========================
# API KEY DÀNH CHO ĐỐI TÁC
# =========================
partner:
  api-key: crs-partner-key-2026


# =========================
# MANAGEMENT
# =========================
management:
  endpoints:
    web:
      exposure:
        include: gateway